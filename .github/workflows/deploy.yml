name: Update daily quiz and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '49 5,6,7,10,12,13 * * *'
      timezone: America/Chicago
    - cron: '53 6,12 * * *'
      timezone: America/Chicago
    - cron: '0 12 * * *'
      timezone: America/Chicago
    # Additional UTC recovery checks if a primary scheduled trigger is missed.
    # 06:37–15:37 CDT / 05:37–14:37 CST; stats remain gated until noon Central.
    - cron: '37 11-20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Queued recovery runs should use the most recent saved quiz and code.
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Set up ingestion Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ingestion/requirements.txt
      - name: Install dependencies
        run: npm ci
      - name: Test game logic
        run: npm test
      - name: Install ingestion dependencies
        run: python -m pip install --disable-pip-version-check -r ingestion/requirements.txt
      - name: Test parser and recovery behavior
        run: python -m unittest discover -s ingestion/tests -v
      - name: Collect and validate today's quiz
        run: python -m ingestion.update_quiz
      - name: Collect optional noon Thrice stats
        continue-on-error: true
        timeout-minutes: 5
        run: python -m ingestion.update_stats
      - name: Build static site and validate quiz
        run: npm run build
      - name: Save validated quiz and archives
        shell: bash
        run: |
          set -euo pipefail
          git add -- public/data
          if git diff --cached --quiet; then
            echo "Today's quiz is already saved. Continuing to deploy for recovery."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          quiz_date=$(node -p "JSON.parse(require('fs').readFileSync('public/data/today.json', 'utf8')).date")
          git commit -m "Update daily quiz for ${quiz_date}"
          # Never force-push. A concurrent human push is safely retried on the next run.
          git push origin HEAD:main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
